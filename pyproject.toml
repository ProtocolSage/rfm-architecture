[tool.poetry]
name = "rfm_architecture"
version = "0.2.0"
description = "Advanced Recursive Fractal Mind architecture visualizer"
authors = ["Maintainer <maintainer@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    {include = "rfm"},
    {include = "rfm_ui", from = "ui"}
]

[tool.poetry.dependencies]
python = "^3.9"
matplotlib = "^3.7"
networkx = "^3.1"
numpy = "^1.26.0"
PyYAML = "^6.0"
scipy = "^1.11.0"

[tool.poetry.scripts]
rfm-viz = "rfm.main:main"

[tool.poetry.dev-dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
flake8 = "^7.0"
black = "^24.4"
typing-extensions = "^4.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "resilience: long-running resilience tests that spawn real subprocess servers",
    "integration: integration tests that require a live WebSocket server",
]
# Keep manual harnesses such as chaos_test.py, client_test.py, server_test.py,
# resilience_test.py, and run_resilience_test.py out of default collection.
# Use `just test-resilience` or an explicit path when intentionally running them.
norecursedirs = [".git", ".venv", ".venv-mac", "node_modules", "dist", "build"]
