name: WebSocket Resilience Tests

on:
  push:
    paths:
      - 'rfm/core/websocket_*.py'
      - 'ui/rfm_ui/websocket_*.py'
      - 'tests/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/resilience-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'rfm/core/websocket_*.py'
      - 'ui/rfm_ui/websocket_*.py'
      - 'tests/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/resilience-tests.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test-jwt-secret-key-for-ci' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
      
      - name: Run unit tests
        run: |
          pytest tests/test_websocket_client_server.py -v
          pytest tests/test_progress_reporting.py -v
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-unit
          path: |
            test-results/
            .coverage
            coverage.xml
          retention-days: 7

  resilience-tests:
    name: Resilience Smoke
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install matplotlib psutil
      
      - name: Generate SSL certificates
        run: |
          mkdir -p tools/ssl/certs
          cd tools/ssl
          chmod +x generate_certs.sh
          ./generate_certs.sh
      
      - name: Run connection resilience test
        run: |
          python tests/run_resilience_test.py --tests connection --start-server --duration 20 --restart-count 1 --restart-interval 2

      - name: Run operation resilience test
        run: |
          python tests/run_resilience_test.py --tests operation --start-server --duration 20 --operation-count 2
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-resilience
          path: |
            test-results/
            reports/
          retention-days: 7
