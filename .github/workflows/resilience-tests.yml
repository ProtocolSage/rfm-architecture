name: WebSocket Resilience Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'rfm/core/websocket_*.py'
      - 'ui/rfm_ui/websocket_*.py'
      - 'tests/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/resilience-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'rfm/core/websocket_*.py'
      - 'ui/rfm_ui/websocket_*.py'
      - 'tests/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/resilience-tests.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.10'
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test-jwt-secret-key-for-ci' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
      
      - name: Run unit tests
        run: |
          pytest tests/test_websocket_client_server.py -v
          pytest tests/test_progress_reporting.py -v
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-unit
          path: |
            test-results/
            .coverage
            coverage.xml
          retention-days: 7

  resilience-tests:
    name: Resilience Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install matplotlib psutil
      
      - name: Generate SSL certificates
        run: |
          mkdir -p tools/ssl/certs
          cd tools/ssl
          chmod +x generate_certs.sh
          ./generate_certs.sh
      
      - name: Run connection resilience tests
        run: |
          python tests/run_resilience_test.py --tests connection --start-server --junit-xml
      
      - name: Run operation resilience tests
        run: |
          python tests/run_resilience_test.py --tests operation --start-server --junit-xml
      
      - name: Run load resilience tests
        run: |
          python tests/run_resilience_test.py --tests load --start-server --client-count 5 --junit-xml
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-resilience
          path: |
            test-results/
            reports/
          retention-days: 7

  e2e-tests:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Start WebSocket server
        run: |
          python run_websocket_server.py &
          sleep 3  # Wait for server to start
      
      - name: Run Playwright tests
        run: |
          npx playwright test tests/e2e/websocket-resilience.spec.ts
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  resource-monitoring:
    name: Resource Monitoring
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install matplotlib psutil
      
      - name: Run server with monitoring
        run: |
          python run_websocket_server.py &
          SERVER_PID=$!
          sleep 3  # Wait for server to start
          
          # Run client test to generate load
          python run_client_test.py --duration 30 &
          CLIENT_PID=$!
          
          # Monitor resources for 45 seconds
          python tools/monitor_resources.py python --port 8765 --interval 1 --output-dir ./reports/resources
          
          # Clean up processes
          kill $CLIENT_PID || true
          kill $SERVER_PID || true
          
          # Verify resource cleanup
          python tools/monitor_resources.py python --port 8765 --verify-cleanup
      
      - name: Upload monitoring results
        uses: actions/upload-artifact@v3
        with:
          name: resource-monitoring
          path: |
            reports/resources/
          retention-days: 7

  publish-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: [resilience-tests, e2e-tests, resource-monitoring]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-artifacts
      
      - name: Merge test reports
        run: |
          mkdir -p merged-report
          cp -r all-artifacts/test-results-unit/* merged-report/ || true
          cp -r all-artifacts/test-results-resilience/* merged-report/ || true
          cp -r all-artifacts/test-results-e2e/* merged-report/ || true
          cp -r all-artifacts/resource-monitoring/* merged-report/ || true
      
      - name: Publish test report
        uses: actions/upload-artifact@v3
        with:
          name: combined-test-report
          path: merged-report
          retention-days: 7