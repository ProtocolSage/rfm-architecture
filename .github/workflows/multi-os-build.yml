name: Multi-OS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry config virtualenvs.create false
        poetry install
        pip install -r requirements.txt
        pip install -r requirements_dev.txt
        
    - name: Install Playwright dependencies
      run: |
        playwright install --with-deps chromium
        
    - name: Run tests
      run: |
        pytest -v
        
    - name: Create screenshot for visual tests
      run: |
        python tests/take_app_screenshot.py
        
    - name: Run visual regression tests
      run: |
        npx playwright test
        
    - name: Build executable
      run: |
        pip install pyinstaller
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          pyinstaller run_premium_ui.py --onefile --noconsole --name RFM-Premium
        elif [ "${{ matrix.os }}" == "macos-latest" ]; then
          pyinstaller run_premium_ui.py --onefile --noconsole --name RFM-Premium
        else 
          pyinstaller run_premium_ui.py --onefile --name RFM-Premium
        fi
      shell: bash
      
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: RFM-Premium-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          dist/RFM-Premium*
          
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          test-results/
          playwright-report/
          tests/screenshots/